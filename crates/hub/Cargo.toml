[package]
name = "echoctl"
version = "0.1.0"
edition = "2021"
description = "Echo: the Hub Daemon and the echoctl CLI"

[[bin]]
name = "echoctl"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hkdf = "0.12"
libc = "0.2"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
portable-pty = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.16"
